[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamewm-engine"
version = "0.1.0"
description = "The GameWM-engine to GameWM-VM request protocol and its reference implementation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "jsonschema"]
games = ["numpy", "av", "pillow"]

[tool.setuptools.packages.find]
include = ["gamewm_engine*"]
